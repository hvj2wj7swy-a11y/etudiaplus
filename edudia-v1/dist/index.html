<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Étudia+ v1</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      .app-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 32%),
          linear-gradient(160deg, #0f172a 0%, #111827 52%, #020617 100%);
        color: #f8fafc;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      .app-splash-screen--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-splash-screen__card {
        display: grid;
        place-items: center;
        gap: 0.85rem;
        padding: 2rem 2.25rem;
        border-radius: 1.75rem;
        background: rgba(15, 23, 42, 0.58);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(18px);
        text-align: center;
        min-width: min(92vw, 360px);
      }

      .app-splash-screen__logo {
        width: 96px;
        height: 96px;
        animation: splashPulse 1.8s ease-in-out infinite;
      }

      .app-splash-screen__brand {
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .app-splash-screen__text {
        color: rgba(226, 232, 240, 0.9);
        font-size: 0.98rem;
      }

      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DUFZokby.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DGvqIoQw.css">
  </head>
  <body>
    <div id="app-splash-screen" class="app-splash-screen" aria-hidden="true">
      <div class="app-splash-screen__card">
        <img src="/icons/icon.svg" alt="Logo Étudia+" class="app-splash-screen__logo" />
        <div class="app-splash-screen__brand">Étudia+</div>
        <div class="app-splash-screen__text">Chargement de votre espace d’étude</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
